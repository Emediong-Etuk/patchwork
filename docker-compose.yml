# PATCHWORK + PostgreSQL. Switch itself runs separately (Switch Console, or the
# self-hosted Switch stack); point SWITCH_BRIDGE_URL at its API URL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patchwork
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/patchwork?schema=public
      # Reach a Switch server running on the host (e.g. http://host.docker.internal:8000).
      SWITCH_BRIDGE_URL: ${SWITCH_BRIDGE_URL:-http://host.docker.internal:8000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["3000:3000"]
    volumes: [workspaces:/app/.patchwork]

volumes:
  pgdata:
  workspaces:
